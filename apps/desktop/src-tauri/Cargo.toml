[package]
name = "sigma-desktop"
version = "0.19.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# macOS 27 dyld rejects stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool"), so keep them unstripped.
[profile.release.build-override]
strip = "none"
debug = false
